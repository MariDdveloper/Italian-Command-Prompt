name: Build eseguibili
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa dipendenze
        shell: bash
        run: |
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Crea eseguibile
        run: pyinstaller --onefile --name italian-command-prompt-${{ matrix.name }} main.py
      - name: Comprimi (macOS e Linux)
        if: matrix.name != 'windows'
        run: |
          cd dist
          zip italian-command-prompt-${{ matrix.name }}.zip italian-command-prompt-${{ matrix.name }}
          rm italian-command-prompt-${{ matrix.name }}
      - name: Allega alla release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/italian-command-prompt-*
